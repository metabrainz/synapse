template {
  source      = "/etc/synapse/config.yaml.ctmpl"
  destination = "/etc/synapse/config.yaml"
}

exec {
  command      = ["/usr/local/bin/run-synapse-command", "/bin/worker", "-config", "/etc/synapse/config.yaml"]
  splay        = "5s"
  reload_signal = "SIGHUP"
  kill_signal  = "SIGTERM"
  kill_timeout = "30s"
}
