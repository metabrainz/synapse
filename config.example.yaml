http:
  port: 8080

postgres:
  host: localhost
  port: 5432
  user: synapse
  password: synapse
  dbname: synapse
  sslmode: disable

redis:
  addr: localhost:6379
  password: ""
  db: 0

oauth:
  client_id: ""
  client_secret: ""
  introspection_url: "https://musicbrainz.org/new-oauth2/introspect"

rabbitmq:
  url: amqp://guest:guest@localhost:5672/

relay:
  outbox_poll_ms: 100
  workers: 4
  batch_size: 100

ingest:
  workers: 4
  batch_size: 50
  drain_ms: 10

telegram:
  bot_token: ""
  webhook_url: ""      # e.g. https://your-domain.com/internal/telegram/webhook
  webhook_secret: ""   # random string; sent as X-Telegram-Bot-Api-Secret-Token

worker:
  db_pool: 15
  channels:
    webhook:
      concurrency: 10
      prefetch: 10
    telegram:
      concurrency: 5
      prefetch: 5

rate_limit:
  burst: 100
  rate_per_sec: 50

observability:
  sentry_dsn: ""           # Sentry project DSN; leave empty to disable
  environment: "development"
  release: ""              # e.g. git SHA injected at build time

tenants:
  listenbrainz:
    api_key: ""
